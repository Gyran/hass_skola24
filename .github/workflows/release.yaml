name: Release

# A pushed version tag becomes a GitHub release. That is what a custom
# repository added by hand installs from. bin/release makes the tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish, for example 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Manifest version must match the tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/skola24/manifest.json'))['version'])")
          if [ "$version" != "$TAG" ]; then
            echo "manifest.json says $version but the tag is $TAG" >&2
            exit 1
          fi
      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
