set_temporary_change_message:
  name: Skriv tillfällig ändring
  description: Skriv meddelandet för ett barn och ett datum. Tomt datum är idag, Europe/Stockholm. Klockslag rörs inte. Texten kommer från anropet.
  fields:
    device_id:
      name: Barn
      description: Barnets Skola24-device.
      required: true
      selector:
        device:
          integration: skola24
    message:
      name: Meddelande
      description: Texten som ska stå på dagen.
      required: true
      selector:
        text:
          multiline: true
      example: Hämtas 15:30
    date:
      name: Datum
      description: YYYY-MM-DD. Tomt betyder idag, Europe/Stockholm.
      required: false
      selector:
        date:
      example: "2026-11-16"
    overwrite:
      name: Skriv över
      description: Av är default. En lapp som redan finns lämnas kvar. På ersätter den.
      required: false
      default: false
      selector:
        boolean:
